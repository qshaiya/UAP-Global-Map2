<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLS={historic:'#7b2fff',military:'#ff6b35',civilian:'#00a8ff',gov:'#f0c040',recent:'#00ffe7'};
let sightings=[],filter='all';
const markerLayer = {}; // id -> L.Marker
let markerGroup;
let map;

function initMap(){
  map = L.map('map',{worldCopyJump:true,minZoom:2,maxZoom:12,zoomControl:false,attributionControl:true}).setView([20,15],2.3);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:19,subdomains:'abcd',
    attribution:'&copy; OpenStreetMap &copy; CARTO'
  }).addTo(map);
  markerGroup = L.layerGroup().addTo(map);
  setTimeout(()=>map.invalidateSize(),200);
  setTimeout(()=>map.invalidateSize(),800);
  window.addEventListener('resize',()=>map.invalidateSize());
}

function pinIcon(s){
  const c=COLS[s.cat]||'#00ffe7';
  const isNew=!!s.isNew;
  const dotCls='pin-dot'+(isNew?' new':'');
  const glow=(s.cat==='recent'||isNew)?`<div class="pin-glow"></div>`:'';
  const approxRing=s.approx?`<div class="pin-approx"></div>`:'';
  const html=`<div class="pin-wrap" style="--c:${c}">${glow}${approxRing}<div class="${dotCls}" style="--c:${c}"></div></div>`;
  const size=isNew?26:22;
  return L.divIcon({className:'',html,iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]});
}

function popupHtml(s){
  const newTag=s.isNew?' <span style="color:var(--acc)">[NEW]</span>':'';
  const approxTag=s.approx?`<div class="pp-approx">\u25cb Approximate location — exact coordinates not confirmed</div>`:'';
  const src=s.source?`<div class="pp-src">\ud83d\udce1 ${s.source}</div>`:'';
  return `<div class="pp-title">${s.name}${newTag}</div>`+
         `<div class="pp-meta">${s.cat.toUpperCase()} \u00b7 ${s.date||''}</div>`+
         `<div class="pp-desc">${s.desc}</div>`+
         src+approxTag;
}

function renderAll(){
  const list=filter==='all'?sightings:sightings.filter(s=>s.cat===filter);
  document.getElementById('pc').textContent=sightings.length;
  document.getElementById('sbc').textContent=list.length+' pins';

  // Rebuild markers
  markerGroup.clearLayers();
  for(const k in markerLayer) delete markerLayer[k];
  list.forEach(s=>{
    if(typeof s.lat!=='number'||typeof s.lng!=='number') return;
    const m=L.marker([s.lat,s.lng],{icon:pinIcon(s)});
    m.bindPopup(popupHtml(s));
    m.addTo(markerGroup);
    markerLayer[s.id]=m;
  });

  // Sidebar
  const el=document.getElementById('sl');el.innerHTML='';
  [...list].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)).forEach(s=>{
    const c=COLS[s.cat]||'#00ffe7',nb=s.isNew?'<span class="stg t-new">NEW</span>':'';
    const approxB=s.approx?' <span style="color:var(--muted);font-size:9px">(approx. location)</span>':'';
    const d=document.createElement('div');
    d.className='sc'+(s.isNew?' n':'');
    d.innerHTML=`<div class="sct"><div class="sd" style="background:${c}${s.isNew?';box-shadow:0 0 5px '+c:''}"></div><div class="sn">${s.name}${approxB}</div></div><div class="sm">${s.cat.toUpperCase()} \u00b7 ${s.date||''}</div><div class="sds">${s.desc.substring(0,88)}${s.desc.length>88?'\u2026':''}</div>${nb}<span class="stg t-${s.cat}">${s.cat.toUpperCase()}</span>`;
    d.onclick=()=>{
      if(typeof s.lat!=='number'||typeof s.lng!=='number')return;
      map.setView([s.lat,s.lng],6,{animate:true});
      const mk=markerLayer[s.id];
      if(mk) setTimeout(()=>mk.openPopup(),400);
    };
    el.appendChild(d);
  });
}

function setFilter(f,btn){filter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('act'));btn.classList.add('act');renderAll();}

function zoom(dir){ map.setZoom(map.getZoom()+dir); }
function resetView(){ map.setView([20,15],2.3,{animate:true}); }

// ── DATA LOADING ──────────────────────────────────────────────────────────
async function loadData(){
  let local=null;try{local=JSON.parse(sessionStorage.getItem('uap_v6'));}catch(e){}
  if(local && local.length){
    sightings=local;
    renderAll();
    log('Restored '+sightings.length+' pins from session.');
  } else {
    sightings=SEED.map(x=>({...x,isNew:false}));
    renderAll();
  }
  try{
    const resp=await fetch('./data/sightings.json?_='+Date.now());
    if(resp.ok){
      const remote=await resp.json();
      if(remote && remote.sightings && remote.sightings.length){
        const cutoff = new Date(Date.now() - 7*24*60*60*1000);
        sightings = remote.sightings.map(s=>({
          ...s,
          isNew: !!s.isNew || (s.addedOn && new Date(s.addedOn) > cutoff)
        }));
        saveData();
        renderAll();
        log('Synced '+sightings.length+' pins from GitHub database (updated '+(remote.updated||'unknown')+').','hi');
      }
    }
  }catch(e){
    log('Could not reach data/sightings.json \u2014 using local database.','warn');
  }
}
function saveData(){try{sessionStorage.setItem('uap_v6',JSON.stringify(sightings));}catch(e){}}

// ── LOG ───────────────────────────────────────────────────────────────────
function log(msg,t=''){
  const el=document.getElementById('lb'),ts=new Date().toLocaleTimeString('en-US',{hour12:false});
  const d=document.createElement('div');d.className='ll'+(t?' '+t:'');d.textContent=`[${ts}] ${msg}`;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
setInterval(()=>{document.getElementById('clk').textContent=new Date().toUTCString().replace('GMT','UTC');},1000);

// ── SYNC ──────────────────────────────────────────────────────────────────
async function runScan(){
  const btn=document.getElementById('sbn'),ov=document.getElementById('sov'),pf=document.getElementById('spf'),st=document.getElementById('stx');
  btn.disabled=true;ov.classList.add('v');
  log('SYNCING WITH GITHUB DATABASE...','hi');
  const steps=[[20,'CONNECTING TO data/sightings.json...'],[45,'FETCHING LATEST AUTO-SCAN RESULTS...'],[70,'MERGING NEW PINS...'],[90,'RE-RENDERING MAP...']];
  for(const[p,m]of steps){pf.style.width=p+'%';st.textContent=m;log(m.toLowerCase());await sleep(350+Math.random()*250);}
  try{
    const resp=await fetch('./data/sightings.json?_='+Date.now());
    if(resp.ok){
      const remote=await resp.json();
      if(remote && remote.sightings && remote.sightings.length){
        const cutoff=new Date(Date.now()-7*24*60*60*1000);
        const oldNames=new Set(sightings.map(s=>s.name.toLowerCase()));
        let added=0;
        remote.sightings.forEach(s=>{
          if(!oldNames.has(s.name.toLowerCase())){
            added++;
            log('\u2726 NEW PIN: '+s.name+' ['+s.cat+']'+(s.approx?' [APPROX]':''),'nw');
          }
        });
        sightings=remote.sightings.map(s=>({...s,isNew:!!s.isNew||(s.addedOn&&new Date(s.addedOn)>cutoff)}));
        saveData();renderAll();
        if(added>0) log(added+' new sighting'+(added>1?'s':'')+' synced from daily scan ('+(remote.updated||'unknown')+').','hi');
        else log('Up to date \u2014 database last updated '+(remote.updated||'unknown')+'. No new pins since last sync.');
      }
    } else {
      log('Could not fetch data/sightings.json (HTTP '+resp.status+').','warn');
    }
  }catch(err){log('Sync error: '+err.message,'warn');}
  pf.style.width='100%';st.textContent='SYNC COMPLETE';await sleep(500);
  ov.classList.remove('v');pf.style.width='0%';btn.disabled=false;
  document.getElementById('ls').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});
  log('Sync complete. Daily auto-scan runs at 09:00 UTC via GitHub Actions.','hi');
}

// ── MANUAL ADD ────────────────────────────────────────────────────────────
function openMod(){document.getElementById('mod').classList.add('o');}
function closeMod(){document.getElementById('mod').classList.remove('o');}
function addPin(){
  const n=document.getElementById('mn').value.trim(),ds=document.getElementById('mds').value.trim();
  const la=parseFloat(document.getElementById('mla').value),ln=parseFloat(document.getElementById('mln').value);
  if(!n||!ds||isNaN(la)||isNaN(ln)){alert('Name, description, lat & lng required.');return;}
  const approx=document.getElementById('mapprox').checked;
  const id='m_'+Date.now();
  sightings.push({id,name:n,desc:ds,lat:la,lng:ln,cat:document.getElementById('mcat').value,date:document.getElementById('mdt').value,source:document.getElementById('msr').value||'Manual',approx,isNew:true});
  saveData();renderAll();closeMod();
  map.setView([la,ln],6,{animate:true});
  const mk=markerLayer[id];
  if(mk) setTimeout(()=>mk.openPopup(),400);
  log('Manual pin added: '+n,'nw');
  ['mn','mds','mla','mln','mdt','msr'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('mapprox').checked=false;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// ── BOOT ──────────────────────────────────────────────────────────────────
initMap();
log('SENTINEL-7 online \u2014 Leaflet map engine active.','hi');
log('Drag to pan \u00b7 Scroll to zoom \u00b7 Click pin for details \u00b7 + to add \u00b7 SYNC NOW to pull latest auto-scan results.');
loadData();
</script>
