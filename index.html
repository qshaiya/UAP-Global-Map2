function lx(lng,w){return((lng+180)/360)*w}
function ly(lat,h){const r=Math.PI/180,s=Math.sin(lat*r);return(h/2)-(h/(2*Math.PI))*Math.log((1+s)/(1-s))}
function proj(lat,lng){
  const W=canvas.width,H=canvas.height,bW=W/view.sc,bH=H/view.sc;
  return{x:(lx(lng,bW)-lx(view.cx,bW))*view.sc+W/2,y:(ly(lat,bH)-ly(view.cy,bH))*view.sc+H/2};
}

function drawMap(){
  resize();
  const W=canvas.width,H=canvas.height;
  ctx.fillStyle='#020810';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(0,255,231,0.04)';ctx.lineWidth=0.5;
  for(let lng=-180;lng<=180;lng+=30){const p1=proj(85,lng),p2=proj(-85,lng);ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();}
  for(let lat=-60;lat<=80;lat+=30){ctx.beginPath();for(let ln=-180;ln<=180;ln+=5){const p=proj(lat,ln);ln===-180?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}ctx.stroke();}
  ctx.strokeStyle='rgba(0,255,231,0.08)';ctx.beginPath();for(let ln=-180;ln<=180;ln+=2){const p=proj(0,ln);ln===-180?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);}ctx.stroke();
  ctx.fillStyle='#0d1f35';ctx.strokeStyle='rgba(0,168,255,0.22)';ctx.lineWidth=0.8;
  CONTINENTS.forEach(poly=>{ctx.beginPath();poly.forEach((pt,i)=>{const p=proj(pt[0],pt[1]);i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y);});ctx.closePath();ctx.fill();ctx.stroke();});
}
function drawPins(){
  const list=filter==='all'?sightings:sightings.filter(s=>s.cat===filter);
  list.forEach(s=>{
    const p=proj(s.lat,s.lng);
    if(p.x<-20||p.x>canvas.width+20||p.y<-20||p.y>canvas.height+20)return;
    const c=COLS[s.cat]||'#00ffe7',r=s.isNew?7:5;
    if(s.cat==='recent'||s.isNew){
      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,r*3.5);
      const hex=c.replace('#','');const R=parseInt(hex.substr(0,2),16),G=parseInt(hex.substr(2,2),16),B=parseInt(hex.substr(4,2),16);
      g.addColorStop(0,`rgba(${R},${G},${B},0.35)`);g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.beginPath();ctx.arc(p.x,p.y,r*3.5,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    }
    if(s.approx){
      ctx.save();
      ctx.setLineDash([2,2]);
      ctx.strokeStyle='rgba(200,230,255,0.4)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,p.y,r+5,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur=s.isNew?14:7;ctx.shadowColor=c;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
    ctx.shadowBlur=0;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.lineWidth=1;ctx.stroke();
  });
}
function render(){drawMap();drawPins();}
function resize(){
  const ar=canvas.parentElement;
  const W=ar.clientWidth,H=Math.max(ar.clientHeight-115,100);
  if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H;}
}
function zoom(f){view.sc=Math.min(Math.max(view.sc*f,0.8),14);render();}
function resetView(){view={cx:15,cy:20,sc:1.4};render();}

canvas.addEventListener('mousedown',e=>{drag=true;dragS={x:e.clientX,y:e.clientY};dragV={cx:view.cx,cy:view.cy};});
canvas.addEventListener('mousemove',e=>{
  if(drag){
    const dx=e.clientX-dragS.x,dy=e.clientY-dragS.y;
    const W=canvas.width,H=canvas.height,bH=H/view.sc;
    view.cx=dragV.cx-(dx/view.sc/W)*360;
    const ry=ly(dragV.cy,bH),ny=ry-dy/view.sc,n=Math.PI-(2*Math.PI*ny/bH);
    view.cy=(180/Math.PI)*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
    render();
  } else {
    const r=canvas.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    const list=filter==='all'?sightings:sightings.filter(s=>s.cat===filter);
    let hit=null;for(const s of list){const p=proj(s.lat,s.lng);if(Math.hypot(mx-p.x,my-p.y)<11){hit=s;break;}}
    const t=document.getElementById('tip');
    if(hit){
      canvas.style.cursor='pointer';t.style.display='block';
      let tx=mx+14,ty=my-8;
      if(tx+260>canvas.width)tx=mx-265;if(ty+130>canvas.height)ty=my-130;
      t.style.left=tx+'px';t.style.top=ty+'px';
      document.getElementById('tit').textContent=hit.name+(hit.isNew?' [NEW]':'')+(hit.approx?' (approx.)':'');
      document.getElementById('tmt').textContent=hit.cat.toUpperCase()+' · '+(hit.date||'');
      document.getElementById('tds').textContent=hit.desc;
      document.getElementById('tsr').textContent=hit.source?'📡 '+hit.source:'';
    } else {canvas.style.cursor='grab';t.style.display='none';}
  }
});
canvas.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('mouseleave',()=>{drag=false;document.getElementById('tip').style.display='none';});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.15:0.87);},{passive:false});
let ltd=0;
canvas.addEventListener('touchstart',e=>{if(e.touches.length===1){drag=true;dragS={x:e.touches[0].clientX,y:e.touches[0].clientY};dragV={cx:view.cx,cy:view.cy};}else{ltd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===1&&drag){const dx=e.touches[0].clientX-dragS.x,dy=e.touches[0].clientY-dragS.y;const W=canvas.width,H=canvas.height,bH=H/view.sc;view.cx=dragV.cx-(dx/view.sc/W)*360;const ry=ly(dragV.cy,bH),ny=ry-dy/view.sc,n=Math.PI-(2*Math.PI*ny/bH);view.cy=(180/Math.PI)*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));render();}else if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);zoom(d/ltd);ltd=d;}e.preventDefault();},{passive:false});
canvas.addEventListener('touchend',()=>drag=false,{passive:false});

async function loadData(){
  let local=null;try{local=JSON.parse(sessionStorage.getItem('uap_v5'));}catch(e){}
  if(local && local.length){
    sightings=local;
    renderAll();
    log('Restored '+sightings.length+' pins from session.');
  } else {
    sightings=SEED.map(x=>({...x,isNew:false}));
    renderAll();
  }
  // Try to fetch the latest synced database from GitHub
  try{
    const resp=await fetch('./data/sightings.json?_='+Date.now());
    if(resp.ok){
      const remote=await resp.json();
      if(remote && remote.sightings && remote.sightings.length){
        const cutoff = new Date(Date.now() - 7*24*60*60*1000);
        sightings = remote.sightings.map(s=>({
          ...s,
          isNew: !!s.isNew || (s.addedOn && new Date(s.addedOn) > cutoff)
        }));
        saveData();
        renderAll();
        log('Synced '+sightings.length+' pins from GitHub database (updated '+(remote.updated||'unknown')+').','hi');
      }
    }
  }catch(e){
    log('Could not reach data/sightings.json — using local database.','warn');
  }
}
function saveData(){try{sessionStorage.setItem('uap_v5',JSON.stringify(sightings));}catch(e){}}

function renderAll(){
  const list=filter==='all'?sightings:sightings.filter(s=>s.cat===filter);
  document.getElementById('pc').textContent=sightings.length;
  document.getElementById('sbc').textContent=list.length+' pins';
  const el=document.getElementById('sl');el.innerHTML='';
  [...list].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0)).forEach(s=>{
    const c=COLS[s.cat]||'#00ffe7',nb=s.isNew?'<span class="stg t-new">NEW</span>':'';
    const approxB=s.approx?' <span style="color:var(--muted);font-size:9px">(approx. location)</span>':'';
    const d=document.createElement('div');
    d.className='sc'+(s.isNew?' n':'');
    d.innerHTML=`<div class="sct"><div class="sd" style="background:${c}${s.isNew?';box-shadow:0 0 5px '+c:''}"></div><div class="sn">${s.name}${approxB}</div></div><div class="sm">${s.cat.toUpperCase()} · ${s.date||''}</div><div class="sds">${s.desc.substring(0,88)}${s.desc.length>88?'…':''}</div>${nb}<span class="stg t-${s.cat}">${s.cat.toUpperCase()}</span>`;
    d.onclick=()=>{view.cx=s.lng;view.cy=s.lat;view.sc=Math.max(view.sc,3.5);render();};
    el.appendChild(d);
  });
  render();
}
function setFilter(f,btn){filter=f;document.querySelectorAll('.fb').forEach(b=>b.classList.remove('act'));btn.classList.add('act');renderAll();}

function log(msg,t=''){
  const el=document.getElementById('lb'),ts=new Date().toLocaleTimeString('en-US',{hour12:false});
  const d=document.createElement('div');d.className='ll'+(t?' '+t:'');d.textContent=`[${ts}] ${msg}`;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
setInterval(()=>{document.getElementById('clk').textContent=new Date().toUTCString().replace('GMT','UTC');},1000);

async function runScan(){
  const btn=document.getElementById('sbn'),ov=document.getElementById('sov'),pf=document.getElementById('spf'),st=document.getElementById('stx');
  btn.disabled=true;ov.classList.add('v');
  log('LIVE SCAN INITIATED — searching all sources...','hi');
  const steps=[[10,'QUERYING NUFORC DATABASE...'],[22,'SCANNING REDDIT r/UFOs...'],[35,'SEARCHING X/TWITTER FEEDS...'],[48,'CHECKING PENTAGON UAP PORTAL...'],[60,'SEARCHING NEWS WIRE...'],[72,'QUERYING MUFON REPORTS...'],[85,'CROSS-REF AARO DATA...'],[95,'COMPILING...']];
  for(const[p,m]of steps){pf.style.width=p+'%';st.textContent=m;log(m.toLowerCase());await sleep(440+Math.random()*330);}
  log('Calling SENTINEL-7 AI with live web search...','warn');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:'You are a UAP intelligence extraction agent. Search the internet for the LATEST UAP/UFO sightings and government disclosures. Return ONLY valid JSON array (no markdown, no extra text): [{"name":"Location, Country","lat":0.0,"lng":0.0,"cat":"recent","date":"Month Year","desc":"Under 120 chars factual description","source":"Source name"}] Categories: recent, military, civilian, gov, historic. Return 5-8 real incidents with accurate coordinates.',tools:[{type:'web_search_20250305',name:'web_search'}],messages:[{role:'user',content:'Search for the latest UAP UFO sighting reports and government disclosures 2024 and 2025 with specific locations. JSON array only.'}]})});
    const data=await r.json();
    let txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').replace(/```json|```/g,'').trim();
    const s=txt.indexOf('['),e=txt.lastIndexOf(']');
    if(s>=0&&e>s){
      const items=JSON.parse(txt.slice(s,e+1));let added=0;
      items.forEach(item=>{if(item.name&&item.lat&&item.lng&&!sightings.find(x=>x.name===item.name)){sightings.push({...item,id:'sc_'+Date.now()+'_'+Math.random().toString(36).substr(2,4),isNew:true});added++;log('❆ NEW PIN: '+item.name+' ['+item.cat+']','nw');}});
      if(added>0){saveData();renderAll();log(added+' new sighting'+(added>1?'s':'')+' added to map.','hi');}
      else log('No additional locations found beyond current database.');
    }
  }catch(err){log('Scan error: '+err.message,'warn');}
  pf.style.width='100%';st.textContent='SCAN COMPLETE';await sleep(700);
  ov.classList.remove('v');pf.style.width='0%';btn.disabled=false;
  document.getElementById('ls').textContent=new Date().toLocaleTimeString('en-US',{hour12:false});
  log('Scan complete. Map updated.','hi');
}
function openMod(){document.getElementById('mod').classList.add('o');}
function closeMod(){document.getElementById('mod').classList.remove('o');}
function addPin(){
  const n=document.getElementById('mn').value.trim(),ds=document.getElementById('mds').value.trim();
  const la=parseFloat(document.getElementById('mla').value),ln=parseFloat(document.getElementById('mln').value);
  if(!n||!ds||isNaN(la)||isNaN(ln)){alert('Name, description, lat & lng required.');return;}
  sightings.push({id:'m_'+Date.now(),name:n,desc:ds,lat:la,lng:ln,cat:document.getElementById('mcat').value,date:document.getElementById('mdt').value,source:document.getElementById('msr').value||'Manual',isNew:true});
  saveData();renderAll();closeMod();view.cx=ln;view.cy=la;view.sc=Math.max(view.sc,4);render();
  log('Manual pin added: '+n,'nw');
  ['mn','mds','mla','mln','mdt','msr'].forEach(id=>document.getElementById(id).value='');
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
window.addEventListener('resize',()=>render());
loadData();
log('SENTINEL-7 online — canvas map engine active.','hi');
log('Database: '+SEED.length+' UAP locations across 6 continents — updated May 2026.','hi');
log('Drag to pan · Scroll to zoom · Hover for details · + to add · SCAN NOW for live search.');
</script>
