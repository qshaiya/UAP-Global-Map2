name: Daily UAP Scan

on:
  schedule:
    # Runs every day at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch: {}   # allows manual "Run workflow" button

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run UAP scan via OpenRouter API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 .github/scripts/scan.py

      - name: Commit and push if changed
        run: |
          git config user.name "sentinel-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sightings.json
          if ! git diff --cached --quiet; then
            git commit -m "🛰️ Auto-scan: new UAP sightings $(date -u +'%Y-%m-%d')"
            git push
          else
            echo "No new sightings found today."
          fi
