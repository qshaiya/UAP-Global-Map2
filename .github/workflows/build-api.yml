name: Build API Files

on:
  # Re-build API files every time sightings.json is updated
  push:
    paths:
      - 'data/sightings.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate static API JSON files
        run: python3 .github/scripts/build_api.py

      - name: Commit and push API files
        run: |
          git config user.name "sentinel-7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/
          if ! git diff --cached --quiet; then
            git commit -m "🔌 API rebuild: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "API files unchanged."
          fi
